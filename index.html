<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./images/logo.svg" />
    <title>Cyclone Viewer</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- Optional: Leaflet EasyPrint -->
    <script src="https://rawgit.com/rowanwins/leaflet-easyPrint/gh-pages/dist/bundle.js"></script>
    <!-- Optional: shpjs for shapefiles -->
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <!-- Optional: PapaParse for CSV -->
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./easyprint.css" />
  </head>
  <body>
    <div id="app" class="container">
      <div id="map-container">
        <div id="map"></div>
      </div>

      <!-- UI Controls (Floating) -->
      <div id="ui-controls" class="ui-panel hidden">
        <!-- Content injected by visualization-panel.js -->
      </div>

      <!-- Notification Toast -->
      <div id="notification" class="notification hidden"></div>

      <!-- Keyboard Shortcuts Modal -->
      <div id="keyboard-shortcuts-modal" class="modal hidden">
        <div class="modal-overlay" data-close="true"></div>
        <div class="modal-content">
          <h2>Keyboard Shortcuts</h2>
          <button id="keyboard-shortcuts-close" class="close-btn">
            &times;
          </button>
          <ul class="shortcuts-list">
            <li><kbd>?</kbd> Toggle this help</li>
            <li><kbd>Esc</kbd> Close modals / Deselect</li>
            <!-- Add more shortcuts here -->
          </ul>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
